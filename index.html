<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow Office App</title>
    <style>
        :root {
            --bg-color: #070707;
            --text-color: #f4f4f4;
            --border-color: #555555;
            --docs-color: #00e5ff;
            --sheets-color: #00ff41;
            --slides-color: #ffaa00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden; /* Evitar scroll durante el inicio */
            height: 100vh;
        }

        /* --- PANTALLA DE INICIO (ESTÉTICA A24) --- */
        #intro-screen {
            display: grid;
            grid-template-columns: 40px 1fr 1fr;
            grid-template-rows: 60px 1fr 100px;
            width: 100vw;
            height: 100vh;
            border: 1px solid var(--border-color);
            transition: opacity 0.8s cubic-bezier(0.77, 0, 0.175, 1), filter 0.8s ease;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        /* Ocultar el intro cuando se inicia */
        .intro-hidden {
            opacity: 0;
            filter: blur(10px);
            pointer-events: none;
            transform: scale(0.98);
        }

        /* Barra Superior */
        .top-bar {
            grid-column: 1 / 4;
            grid-row: 1;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hamburger {
            width: 40px;
            height: 100%;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .hamburger span { display: block; width: 20px; height: 1px; background: var(--text-color); }

        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; }

        .top-links { height: 100%; display: flex; }
        .top-links div {
            height: 100%;
            padding: 0 20px;
            border-left: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            font-size: 0.8rem;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }

        /* Barra Lateral Izquierda */
        .sidebar {
            grid-column: 1;
            grid-row: 2;
            border-right: 1px solid var(--border-color);
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            display: flex;
            align-items: center;
            padding-bottom: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        /* Contenido Central (Texto Gigante) */
        .hero-text {
            grid-column: 2;
            grid-row: 2;
            border-right: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            padding: 2rem;
            font-size: clamp(3rem, 7vw, 7rem);
            line-height: 0.85;
            font-weight: 700;
            letter-spacing: -2px;
        }

        /* Contenido Derecho (Imágenes Flotantes) */
        .hero-visual {
            grid-column: 3;
            grid-row: 2;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a1a 0%, var(--bg-color) 80%);
        }

        .floating-img {
            position: absolute;
            width: 50%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        /* Animaciones para simular el efecto del link */
        .img-1 { top: 5%; left: 15%; animation: float1 12s infinite alternate ease-in-out; z-index: 3; }
        .img-2 { top: 35%; left: 40%; animation: float2 15s infinite alternate ease-in-out; z-index: 2; }
        .img-3 { top: 55%; left: 10%; animation: float3 18s infinite alternate ease-in-out; z-index: 1; }

        @keyframes float1 { 
            0% { transform: translateY(0px) rotate(-2deg); } 
            100% { transform: translateY(40px) rotate(3deg); } 
        }
        @keyframes float2 { 
            0% { transform: translateY(30px) rotate(4deg); } 
            100% { transform: translateY(-30px) rotate(-1deg); } 
        }
        @keyframes float3 { 
            0% { transform: translateY(-20px) rotate(-3deg); } 
            100% { transform: translateY(50px) rotate(2deg); } 
        }

        /* Barra Inferior */
        .bottom-bar {
            grid-column: 1 / 4;
            grid-row: 3;
            border-top: 1px solid var(--border-color);
            display: flex;
            font-family: 'Courier New', Courier, monospace;
        }

        .bottom-info {
            flex: 1;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 20px;
        }
        .bottom-info p { font-size: 0.8rem; margin-bottom: 5px; }
        .bottom-info h2 { font-size: 1rem; font-weight: normal; }

        .price-box {
            width: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border-color);
            font-size: 1.5rem;
            color: #888;
        }

        .btn-iniciar {
            width: 250px;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            font-size: 2.5rem;
            font-weight: bold;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }
        .btn-iniciar:hover { background-color: #cccccc; }

        /* --- MENÚ PRINCIPAL (LISTA DE APPS) --- */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            padding: 2rem;
            opacity: 0;
            z-index: 5;
            background-color: var(--bg-color);
            overflow-y: auto;
        }

        #main-menu.visible {
            display: flex;
            animation: fadeInMenu 1s forwards 0.3s;
        }

        @keyframes fadeInMenu { to { opacity: 1; } }

        .app-card {
            display: flex;
            flex-direction: column;
            width: 320px;
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            background-color: #000;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(40px);
        }

        #main-menu.visible .app-card:nth-child(1) { animation: slideUpFade 0.7s forwards 0.4s; }
        #main-menu.visible .app-card:nth-child(2) { animation: slideUpFade 0.7s forwards 0.6s; }
        #main-menu.visible .app-card:nth-child(3) { animation: slideUpFade 0.7s forwards 0.8s; }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        .app-card img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.4s ease;
        }

        .app-title {
            padding: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: 0.1rem;
        }

        /* Efectos Hover */
        .app-card.docs:hover { border-color: var(--docs-color); transform: translateY(-10px); box-shadow: 0 10px 30px rgba(0, 229, 255, 0.1); }
        .app-card.docs:hover .app-title { color: var(--docs-color); }
        
        .app-card.sheets:hover { border-color: var(--sheets-color); transform: translateY(-10px); box-shadow: 0 10px 30px rgba(0, 255, 65, 0.1); }
        .app-card.sheets:hover .app-title { color: var(--sheets-color); }
        
        .app-card.slides:hover { border-color: var(--slides-color); transform: translateY(-10px); box-shadow: 0 10px 30px rgba(255, 170, 0, 0.1); }
        .app-card.slides:hover .app-title { color: var(--slides-color); }

        /* Responsividad */
        @media (max-width: 900px) {
            #intro-screen {
                grid-template-columns: 40px 1fr;
                grid-template-rows: 60px 1fr 1fr 100px;
            }
            .top-bar { grid-column: 1 / 3; }
            .hero-text { grid-column: 2; grid-row: 2; border-right: none; font-size: 3rem; }
            .hero-visual { grid-column: 2; grid-row: 3; }
            .bottom-bar { grid-column: 1 / 3; grid-row: 4; }
            .price-box { display: none; }
            .btn-iniciar { width: 150px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Pantalla inicial con diseño de cuadrícula -->
    <div id="intro-screen">
        
        <div class="top-bar">
            <div class="hamburger">
                <span></span><span></span><span></span>
            </div>
            <div class="logo">MEOW</div>
            <div class="top-links">
                <div>ABOUT</div>
                <div>GALEED</div>
            </div>
        </div>

        <div class="sidebar">
            MEOW OFFICE SUITE
        </div>

        <div class="hero-text">
            YOUR<br>TICKET<br>TO<br>EVERY-<br>THING<br>MEOW
        </div>

        <div class="hero-visual">
            <!-- Las 3 imágenes flotando con la extensión correcta -->
            <img src="image.PNG" alt="Docs" class="floating-img img-1">
            <img src="image_2.PNG" alt="Sheets" class="floating-img img-2">
            <img src="image_3.PNG" alt="Slides" class="floating-img img-3">
        </div>

        <div class="bottom-bar">
            <div class="bottom-info">
                <p>BENEFITS INCLUDE:</p>
                <h2>01 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; OFFICE TOOLS</h2>
            </div>
            <div class="price-box">
                FREE <span style="font-size: 0.8rem; margin-left: 5px;">/USER</span>
            </div>
            <!-- Botón de inicio modificado -->
            <button id="iniciar-btn" class="btn-iniciar">INICIAR</button>
        </div>

    </div>

    <!-- Menú de lista de aplicaciones que aparece tras hacer clic -->
    <div id="main-menu">
        
        <a href="meow_docs.html" class="app-card docs">
            <img src="image.PNG" alt="Meow Docs">
            <div class="app-title">MEOW DOCS</div>
        </a>

        <a href="meow_sheets.html" class="app-card sheets">
            <img src="image_2.PNG" alt="Meow Sheets">
            <div class="app-title">MEOW SHEETS PRO</div>
        </a>

        <a href="meow_slides.html" class="app-card slides">
            <img src="image_3.PNG" alt="Meow Slides">
            <div class="app-title">MEOW SLIDES V3.0</div>
        </a>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnIniciar = document.getElementById('iniciar-btn');
            const introScreen = document.getElementById('intro-screen');
            const mainMenu = document.getElementById('main-menu');
            const body = document.body;

            btnIniciar.addEventListener('click', () => {
                // Desvanece y difumina la cuadrícula completa estilo A24
                introScreen.classList.add('intro-hidden');

                // Tras la animación (800ms), quita el menú del flujo y muestra las apps
                setTimeout(() => {
                    introScreen.style.display = 'none';
                    body.style.overflow = 'auto'; // Permitir scroll si la pantalla es pequeña
                    
                    mainMenu.style.display = 'flex';
                    void mainMenu.offsetWidth; // Reiniciar DOM para animaciones
                    mainMenu.classList.add('visible');
                }, 800); 
            });
        });
    </script>
</body>
</html>
